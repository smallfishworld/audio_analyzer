name: macOS desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS ${{ matrix.label }} DMG
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: apple-silicon-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - label: intel-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Show native architecture
        run: |
          uname -m
          rustc --version
          xcodebuild -version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate app icons
        run: |
          npm run prepare:icons
          bash scripts/generate-macos-icons.sh
          test -s src-tauri/icons/icon.icns
      - name: Build React UI
        run: npm run build
      - name: Build bundled LGPL FFmpeg and matching source
        run: |
          bash scripts/build-ffmpeg-sidecar.sh "${{ matrix.target }}"
          test -x "src-tauri/binaries/ffmpeg-${{ matrix.target }}"
          test -x "src-tauri/binaries/ffprobe-${{ matrix.target }}"
          src-tauri/binaries/ffmpeg-${{ matrix.target }} -version
      - name: Smoke-test actual bundled FFmpeg codecs
        env:
          AUDIO_ANALYZER_FFMPEG: src-tauri/binaries/ffmpeg-${{ matrix.target }}
          AUDIO_ANALYZER_FFPROBE: src-tauri/binaries/ffprobe-${{ matrix.target }}
        run: node scripts/verify-bundled-ffmpeg.mjs
      - name: Validate native Rust app
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build signed native .app (no DMG mount operations)
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles app
      - name: Create DMG with bounded hdiutil retries
        shell: bash
        run: |
          set -euo pipefail
          BASE="src-tauri/target/${{ matrix.target }}/release/bundle"
          APP="$(find "$BASE/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          mkdir -p "$BASE/dmg"
          bash scripts/package-macos-dmg.sh "$APP" "$BASE/dmg/Audio_Analyzer_0.2.0-alpha.3_${{ matrix.target }}.dmg"
      - name: Verify macOS bundles and ad-hoc signature
        shell: bash
        run: |
          set -euo pipefail
          BASE="src-tauri/target/${{ matrix.target }}/release/bundle"
          APP="$(find "$BASE/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          DMG="$(find "$BASE/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          [[ -d "$APP" ]] || { echo "App bundle missing"; exit 1; }
          [[ -s "$DMG" ]] || { echo "DMG missing"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          test -x "$APP/Contents/MacOS/ffmpeg"
          test -x "$APP/Contents/MacOS/ffprobe"
          "$APP/Contents/MacOS/ffmpeg" -version
          "$APP/Contents/MacOS/ffprobe" -version
          AUDIO_ANALYZER_FFMPEG="$APP/Contents/MacOS/ffmpeg" \
          AUDIO_ANALYZER_FFPROBE="$APP/Contents/MacOS/ffprobe" \
            node scripts/verify-bundled-ffmpeg.mjs
          find "$APP/Contents/Resources" -name 'ffmpeg-9.0.2.tar.xz' -print -quit | grep -q ffmpeg
          hdiutil verify "$DMG"
          BINARY="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$BINARY"
          file "$BINARY"
          file "$BINARY" | grep -q '${{ matrix.label == 'apple-silicon-arm64' && 'arm64' || 'x86_64' }}'
          ls -lh "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: audio-analyzer-m1-self-contained-macos-${{ matrix.label }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
